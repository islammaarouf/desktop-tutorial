<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>آدم — مساعدك المالي والشخصي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a24b;
  --gold-dark: #a8863a;
  --bg0: #0e1420;
  --bg1: #16202f;
  --bg2: #1a2436;
  --bg3: #101a2c;
  --text: #eef1f6;
  --text-dim: #b9c2d0;
  --border-gold: rgba(201,162,75,.28);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(160deg, var(--bg0) 0%, var(--bg1) 55%, #1c2a42 100%);
  color: var(--text);
  display: flex;
  justify-content: center;
}
#app {
  width: 100%;
  max-width: 720px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}
/* ── Header ─────────────────────────── */
header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  background: linear-gradient(135deg, #101a2c 0%, #1a2436 100%);
  border-bottom: 1px solid rgba(201,162,75,.35);
  box-shadow: 0 4px 18px rgba(0,0,0,.35);
  z-index: 5;
}
.avatar {
  position: relative;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: linear-gradient(135deg, #c9a24b 0%, #8a6d2a 100%);
  color: #10151f;
  font-size: 25px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 0 3px rgba(201,162,75,.28), 0 6px 16px rgba(0,0,0,.4);
  flex-shrink: 0;
}
.avatar::after {
  content: '';
  position: absolute;
  bottom: 1px;
  inset-inline-end: 1px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #3ddc84;
  box-shadow: 0 0 0 2px #101a2c;
}
.header-text h1 { font-size: 19px; font-weight: 700; color: #f5f1e8; letter-spacing: .2px; }
.header-text p { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }
/* ── Messages ───────────────────────── */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.msg {
  max-width: 82%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 15px;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
  unicode-bidi: plaintext;
  text-align: start;
  animation: pop .18s ease-out;
}
@keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #c9a24b 0%, #a8863a 100%);
  color: #10151f;
  font-weight: 500;
  border-bottom-inline-start-radius: 4px;
}
.msg.bot {
  align-self: flex-start;
  background: var(--bg2);
  color: var(--text);
  border: 1px solid var(--border-gold);
  border-bottom-inline-end-radius: 4px;
}
.msg.voice-tag::before {
  content: '🎙 ';
}
.msg.thinking {
  color: var(--text-dim);
  font-style: italic;
  display: flex;
  gap: 6px;
  align-items: center;
}
.dots span {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--gold);
  border-radius: 50%;
  margin-inline-start: 3px;
  animation: blink 1.2s infinite;
}
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.msg.error {
  background: #3a1c22;
  border: 1px solid rgba(220,90,90,.4);
  color: #f3c1c1;
}
/* ── Composer ───────────────────────── */
#composer {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
  background: rgba(16,26,44,.9);
  border-top: 1px solid var(--border-gold);
}
#input {
  flex: 1;
  background: var(--bg3);
  color: #f2f4f8;
  border: 1px solid rgba(201,162,75,.4);
  border-radius: 14px;
  padding: 12px 14px;
  font-size: 15px;
  font-family: inherit;
  resize: none;
  max-height: 120px;
  unicode-bidi: plaintext;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
#input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,75,.18); }
#input::placeholder { color: #8fa0b8; }
.btn {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
  transition: transform .1s, filter .15s;
  flex-shrink: 0;
}
.btn:active { transform: scale(.94); }
#sendBtn { background: linear-gradient(135deg, #c9a24b, #a8863a); color: #10151f; }
#sendBtn:disabled { filter: grayscale(.6) brightness(.6); cursor: default; }
#micBtn { background: var(--bg2); border: 1px solid var(--border-gold); color: var(--gold); }
#attachBtn { background: var(--bg2); border: 1px solid var(--border-gold); color: var(--gold); font-size: 18px; }
.msg img.attached { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; }
#micBtn.recording {
  background: #b3382f;
  border-color: #ff6b5e;
  color: #fff;
  animation: pulse 1.2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(220,70,60,.55); }
  70% { box-shadow: 0 0 0 14px rgba(220,70,60,0); }
  100% { box-shadow: 0 0 0 0 rgba(220,70,60,0); }
}
/* recording bar */
#recBar {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  background: rgba(179,56,47,.15);
  border-top: 1px solid rgba(255,107,94,.35);
  color: #ffb4ad;
  font-size: 13.5px;
}
#recBar.on { display: flex; }
#recDot { width: 9px; height: 9px; border-radius: 50%; background: #ff5148; animation: blink 1s infinite; }
#recBar .hint { margin-inline-start: auto; color: var(--text-dim); font-size: 12px; }
footer {
  text-align: center;
  font-size: 11px;
  color: rgba(185,194,208,.5);
  padding: 0 0 8px;
  background: rgba(16,26,44,.9);
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">A</div>
    <div class="header-text">
      <h1>آدم</h1>
      <p>مساعدك المالي والشخصي — متاح دائماً</p>
    </div>
  </header>

  <div id="messages"></div>

  <div id="recBar">
    <span id="recDot"></span>
    <span>جاري التسجيل… <span id="recTime">0:00</span></span>
    <span class="hint">دوس المايك تاني للإرسال</span>
  </div>

  <div id="composer">
    <button id="attachBtn" class="btn" title="إرفاق ملف أو صورة">📎</button>
    <input type="file" id="fileInput" accept="image/*,audio/*,.pdf,.txt,.csv" style="display:none">
    <button id="micBtn" class="btn" title="تحدث مع آدم">🎙</button>
    <textarea id="input" rows="1" placeholder="اسألني أي شيء… نص أو صوت"></textarea>
    <button id="sendBtn" class="btn" title="إرسال">➤</button>
  </div>
  <footer>Adam — powered by n8n</footer>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
const CHAT_URL = 'https://islammaarouf.app.n8n.cloud/webhook/adam-app/chat';
const sessionId = 'web-' + (function () {
  try {
    const existing = window.localStorage ? localStorage.getItem('adamSession') : null;
    if (existing) return existing;
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    try { localStorage.setItem('adamSession', id); } catch (e) {}
    return id;
  } catch (e) {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
})();

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const recBar = document.getElementById('recBar');
const recTime = document.getElementById('recTime');
const attachBtn = document.getElementById('attachBtn');
const fileInput = document.getElementById('fileInput');

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  if (f.size > 20 * 1024 * 1024) { addMsg('الملف كبير جداً — الحد الأقصى 20 ميجا.', 'bot error'); fileInput.value = ''; return; }
  const isImage = f.type.startsWith('image/');
  const isAudio = f.type.startsWith('audio/');
  const reader = new FileReader();
  reader.onloadend = () => {
    const dataUrl = String(reader.result);
    const base64 = dataUrl.split(',')[1];
    if (isImage) {
      const div = document.createElement('div');
      div.className = 'msg user';
      div.textContent = 'صورة مرفقة';
      const img = document.createElement('img');
      img.className = 'attached';
      img.src = dataUrl;
      div.appendChild(img);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      const caption = inputEl.value.trim();
      inputEl.value = ''; autoGrow();
      send({ type: 'image', imageBase64: base64, mimeType: f.type, fileName: f.name, text: caption });
    } else if (isAudio) {
      addMsg('رسالة صوتية', 'user', true);
      send({ type: 'audio', audioBase64: base64, fileName: f.name, mimeType: f.type });
    } else {
      addMsg('ملف مرفق: ' + f.name, 'user');
      addMsg('آدم حالياً بيقرأ الصور والصوتيات بس — الملفات النصية قريب.', 'bot');
    }
    fileInput.value = '';
  };
  reader.readAsDataURL(f);
});

function addMsg(text, who, voice) {
  const div = document.createElement('div');
  div.className = 'msg ' + who + (voice ? ' voice-tag' : '');
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}
function addThinking() {
  const div = document.createElement('div');
  div.className = 'msg bot thinking';
  div.innerHTML = 'آدم بيفكر<span class="dots"><span></span><span></span><span></span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function send(payload) {
  sendBtn.disabled = true;
  const thinking = addThinking();
  try {
    const res = await fetch(CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payload, sessionId })
    });
    thinking.remove();
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    addMsg(data.reply || '…', 'bot');
  } catch (e) {
    thinking.remove();
    addMsg('حصل خطأ في الاتصال — جرب تاني بعد ثواني.', 'bot error');
  }
  sendBtn.disabled = false;
}

function sendText() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  inputEl.value = '';
  autoGrow();
  send({ type: 'text', text });
}

sendBtn.addEventListener('click', sendText);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});
function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}
inputEl.addEventListener('input', autoGrow);

/* ── Voice recording ─────────────────── */
let mediaRecorder = null;
let chunks = [];
let recStart = 0;
let recTimer = null;

function fmtTime(s) {
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

async function toggleRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    addMsg('المتصفح ده مش بيدعم التسجيل — جرب Chrome أو Safari حديث.', 'bot error');
    return;
  }
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    let mime = 'audio/webm';
    if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
    mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
    chunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      clearInterval(recTimer);
      recBar.classList.remove('on');
      micBtn.classList.remove('recording');
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: mime });
      if (blob.size < 2000) { addMsg('التسجيل قصير جداً — جرب تتكلم أطول شوية.', 'bot error'); return; }
      const ext = mime.includes('mp4') ? 'm4a' : 'webm';
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64 = String(reader.result).split(',')[1];
        addMsg('رسالة صوتية', 'user', true);
        send({ type: 'audio', audioBase64: base64, fileName: 'voice.' + ext, mimeType: mime });
      };
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    recStart = Date.now();
    recTime.textContent = '0:00';
    recTimer = setInterval(() => { recTime.textContent = fmtTime((Date.now() - recStart) / 1000); }, 500);
    recBar.classList.add('on');
    micBtn.classList.add('recording');
  } catch (e) {
    addMsg('مش قادر أوصل للميكروفون — تأكد إنك وافقت على إذن المايك في المتصفح.', 'bot error');
  }
}
micBtn.addEventListener('click', toggleRecording);

/* ── Welcome ─────────────────────────── */
addMsg('أهلاً إسلام، معك آدم — مساعدك الشخصي.\nاسألني أي شيء — نص أو صوت، بالعربي أو الإنجليزي.\nدوس 🎙 واتكلم على طول.', 'bot');
});
</script>
</body>
</html>
